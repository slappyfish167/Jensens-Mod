name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate curriculum content
        run: python3 tools/validate_curriculum.py

      - name: Build and test
        run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: nihongocraft-jar
          path: build/libs/*.jar

  # Publishes a GitHub Release whenever main is updated (or when run manually).
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nihongocraft-jar
          path: dist

      - name: Read mod version
        id: version
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
        run: |
          gh release create "$TAG" dist/*.jar \
            --target "$GITHUB_SHA" \
            --title "NihongoCraft ${{ steps.version.outputs.version }} (build ${{ github.run_number }})" \
            --generate-notes
